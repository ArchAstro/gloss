[package]
name = "gloss"
version = "0.1.0"
edition = "2021"
description = "Agent-facing intent annotations attached to source edit hunks"
license = "MIT"
repository = "https://github.com/ArchAstro/gloss"
homepage = "https://github.com/ArchAstro/gloss"
readme = "README.md"
keywords = ["annotations", "cli", "git", "agents"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/src/*.rs",
    "/.skills/gloss/SKILL.md",
    "/.skills/gloss/agents/openai.yaml",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
similar = "3.2"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
