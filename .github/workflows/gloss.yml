# Managed by `gloss init`. Re-run it to update this workflow.
name: Gloss

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Validate gloss metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Gloss
        run: |
          if grep -Eq '^name = "gloss"$' Cargo.toml 2>/dev/null && test -f src/main.rs; then
            cargo install --path . --locked
          else
            cargo install --git https://github.com/ArchAstro/gloss --tag v0.1.0 --locked gloss
          fi
      - name: Validate changed files
        env:
          GLOSS_BASE: ${{ github.event.pull_request.base.sha }}
        run: gloss lint
