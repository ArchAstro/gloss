name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - run: cargo test --locked --all-targets --all-features
      - name: Validate Gloss metadata
        if: github.event_name == 'pull_request'
        env:
          GLOSS_BASE: ${{ github.event.pull_request.base.sha }}
        run: cargo run --locked -- lint

  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  homebrew-formula:
    name: Homebrew formula
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render and validate formula
        run: |
          set -euo pipefail
          brew tap-new --no-git gloss-ci/public-release
          formula="$(brew --repository gloss-ci/public-release)/Formula/gloss.rb"
          placeholder_sha="$(printf '0%.0s' {1..64})"
          sed \
            -e "s/__VERSION__/0.1.0/g" \
            -e "s/__SHA_DARWIN_ARM64__/${placeholder_sha}/g" \
            -e "s/__SHA_DARWIN_X64__/${placeholder_sha}/g" \
            -e "s/__SHA_LINUX_X64__/${placeholder_sha}/g" \
            .github/homebrew/gloss.rb.template > "${formula}"
          ruby -c "${formula}"
          brew style gloss-ci/public-release/gloss
          if rg -n 'HOMEBREW_GITHUB_API_TOKEN|api\.github\.com|download_strategy' "${formula}"; then
            echo "Homebrew formula must use only anonymous public release URLs" >&2
            exit 1
          fi
